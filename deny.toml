# cargo-deny configuration for Secure Notes
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Analyse all features (conservative — finds more potential issues).
all-features = true

# ── Advisories ────────────────────────────────────────────────────────────────
[advisories]
# Fail on any known vulnerability.
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

# ── Licenses ──────────────────────────────────────────────────────────────────
[licenses]
version = 2
# Allow only permissive / well-known licences.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "CC0-1.0",
    # OFL-1.1: used by egui's default fonts (SIL Open Font License — permissive for font use)
    "OFL-1.1",
]
# LicenseRef-UFL-1.0 is used by epaint_default_fonts and is not an SPDX identifier;
# the Ubuntu Font Licence is permissive for use/embedding, so we explicitly allow it.
exceptions = [
    { allow = ["LicenseRef-UFL-1.0"], name = "epaint_default_fonts" },
]
confidence-threshold = 0.8

# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
# Deny duplicate versions of the same crate where possible.
multiple-versions = "warn"
# Explicitly disallow crates with known issues.
deny = []

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
# Only allow crates from crates.io (no git deps, no private registries).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

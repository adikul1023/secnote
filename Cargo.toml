[package]
name = "secure-notes"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "secure-notes"
path = "src/main.rs"

[dependencies]
# GUI
egui = "0.29"
eframe = { version = "0.29", features = ["wgpu"] }
egui_commonmark = "0.18"

# Cryptography
aes-gcm = { version = "0.10", features = ["aes", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"

# Secure memory
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.8", features = ["serde"] }

# Recovery mnemonic
bip39 = "2.0"

# Memory-hard KDF for recovery path (VULN-L5)
argon2 = "0.5"

# Atomic save
tempfile = "3"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# Windows APIs
[dependencies.windows]
version = "0.58"
features = [
    "Security_Credentials",
    "Foundation",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Storage_Streams",
]
